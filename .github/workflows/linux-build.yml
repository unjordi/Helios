name: Linux Build &amp; Test

# First-party CI for Helios: builds the host on Ubuntu to validate that
# develop and every PR/branch still compiles, then builds and runs the
# googletest unit suite headless (xvfb). Uses the repo's own
# scripts/linux_build.sh (the same script upstream Sunshine CI uses) for
# deps + the main build, so the dependency list stays self-maintaining.
#
# CUDA/NVENC is skipped (no NVIDIA on the runner) and packaging is skipped
# (this is a compile + test gate, not a release build).

on:
  push:
    branches:
      - develop
      - master
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-linux:
    name: Build &amp; Test (Ubuntu 24.04, GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build (deps + configure + compile)
        run: |
          chmod +x ./scripts/linux_build.sh
          # Compile gate: skip CUDA (no NVIDIA on the runner) and packaging.
          # Publisher flags are package-only branding, so they're omitted here.
          # --skip-cleanup keeps the gcc alternatives in place for the test build below.
          ./scripts/linux_build.sh \
            --skip-cuda \
            --skip-package \
            --skip-cleanup \
            --ubuntu-test-repo

      - name: Confirm binary
        run: |
          ls -la build/sunshine* 2>/dev/null || { echo "::error::sunshine binary not found"; exit 1; }
          file build/sunshine

      # The googletest suite now compiles (the bit-rot was fixed). The run step is
      # still non-blocking (continue-on-error) ON PURPOSE: it includes security
      # regression tests that are RED today and encode the desired (fixed) behavior
      # — see SecurityCertValidation (GHSA-ph75-mgxh-mv57 / CVE-2026-32253). Once
      # that's patched and those go green, flip continue-on-error to false and add
      # this as a required status check on develop.
      - name: Build unit tests
        run: |
          # Re-configure the existing build dir to also build the googletest suite
          # (BUILD_TESTS defaults OFF), then compile just the test target.
          cmake -B build -D BUILD_TESTS=ON
          cmake --build build --target test_sunshine -j"$(nproc)"

      - name: Run unit tests (headless via xvfb)
        continue-on-error: true
        run: |
          test -x build/tests/test_sunshine || { echo "::error::test_sunshine not built"; exit 1; }
          # Curated deterministic + security suites (HW/platform tests need a real
          # GPU/display; the pairing test is DISABLED pending state isolation).
          xvfb-run -a ./build/tests/test_sunshine --gtest_color=yes \
            --gtest_filter='ConfigParse.*:UtilHex.*:SecurityCertValidation.*:MdnsInstanceNameTests/*:FileHandler*'
